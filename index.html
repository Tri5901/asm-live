<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AS Mésanger – Matchs en direct</title>
<meta name="description" content="Suivez en direct les matchs de l'AS Mésanger : score, buts, remplacements, cartons et statistiques des joueurs.">
<meta name="theme-color" content="#000000">
<script>try{var t=JSON.parse(localStorage.getItem("asm-theme"));if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASM Live">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1E6; --surface:#FFFFFF; --ink:#1A1A17; --muted:#65635A; --line:#D9D5C3;
  --board:#000000; --club:#F7E01A; --accent:#1A1A17; --home:#1A1A17; --homeInk:#F7E01A; --away:#8A8880; --awayInk:#FFFFFF;
  --yellow:#F2C200; --red:#D0262A; --live:#D0262A; --ok:#2E7D32; --shadow:0 1px 0 rgba(26,26,23,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D0B; --surface:#1B1B18; --ink:#F2F0E6; --muted:#A3A092; --line:#34332D;
    --board:#000000; --accent:#F7E01A; --home:#F7E01A; --homeInk:#000000; --away:#4A4943; --awayInk:#FFFFFF; --shadow:none; --ok:#66BB6A;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D0B; --surface:#1B1B18; --ink:#F2F0E6; --muted:#A3A092; --line:#34332D;
  --board:#000000; --accent:#F7E01A; --home:#F7E01A; --homeInk:#000000; --away:#4A4943; --awayInk:#FFFFFF; --shadow:none; --ok:#66BB6A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--club);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 40px}
[hidden]{display:none!important}

/* En-tête du site */
.top{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
.top a.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:1;min-width:0}
.top img{width:40px;height:auto;flex:none}
.top b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:24px;line-height:1}
.top small{display:block;color:var(--muted);font-size:13px}
.acct{font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;text-decoration:none}
.bell{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;flex:none;filter:grayscale(1);opacity:.7}
.bell.on{filter:none;opacity:1;border-color:var(--club)}
.follow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fl{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600;min-height:48px}
.fl input{width:20px;height:20px;accent-color:var(--club)}
.back{display:inline-block;margin:0 0 10px;color:var(--muted);font-weight:600;font-size:14px;text-decoration:none;padding:4px 0}
.tabs{display:flex;gap:6px;margin:0 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs a{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;text-decoration:none;color:var(--muted)}
.tabs a.on{background:var(--ink);color:var(--bg)}

/* Liste des matchs */
.chipbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}
.chipbar button{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.chipbar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button{padding-left:4px;padding-right:4px}
.sec{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px}
.mcard{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.mcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.mcard .row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.mcard .tn{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:19px;line-height:1.1;overflow-wrap:anywhere}
.mcard .tn.r{text-align:right;justify-content:flex-end}
.mcard .tn{display:flex;align-items:center;gap:8px;min-width:0}
.mcard .lg{width:26px;height:26px;object-fit:contain;flex:none;border-radius:4px;background:#fff}
.team .blg{display:block;width:44px;height:44px;object-fit:contain;margin:0 auto 6px;border-radius:6px;background:#fff}
.mcard .tn.club{font-weight:800}
.mcard .sc{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}
.badge.live{background:var(--live);color:#fff}
.badge.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.badge.w{background:var(--ok);color:#fff}
.badge.l{background:var(--red);color:#fff}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.badge.live::before{animation:none}}

/* Tableau d'affichage */
.board{background:var(--board);color:#fff;border-top:6px solid var(--club);border-radius:18px;padding:14px 14px 12px;position:relative;overflow:hidden}
.bmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:rgba(255,255,255,.7)}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team .tname{display:block;color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;line-height:1.1;text-align:center;overflow-wrap:anywhere}
.team .tname.club{color:var(--club);font-weight:800}
.score{color:var(--club);font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:64px;line-height:1;letter-spacing:1px;
  display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.score span.sep{opacity:.5;font-weight:500;font-size:40px}
.clockrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.clock{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:34px;font-variant-numeric:tabular-nums;color:#fff;padding:0;line-height:1.1}
.period{font-size:14px;opacity:.85}
.clockbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cbtn{background:var(--club);color:#000;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;
  padding:10px 16px;border-radius:999px;min-height:44px;white-space:nowrap}
.cbtn.ghost{background:rgba(255,255,255,.14);color:#fff}
.cbtn.small{font-size:14px;padding:6px 12px;min-height:36px;align-self:center;order:-1}
.syncrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 2px 0;font-size:13px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.wait::before{background:var(--yellow)}
.sync.off::before{background:var(--red)}

/* Actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.col{display:flex;flex-direction:column;gap:8px}
.col h2{margin:0 0 2px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.act{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px;min-height:54px;font-weight:600;box-shadow:var(--shadow);text-align:left}
.act:active{transform:scale(.98)}
.act.goal{color:#fff;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;justify-content:center;min-height:64px;border:0}
.col.home .act.goal{background:var(--home);color:var(--homeInk)}
.col.away .act.goal{background:var(--away);color:var(--awayInk)}
.ic{width:18px;height:24px;border-radius:3px;flex:none}
.ic.y{background:var(--yellow)} .ic.r{background:var(--red)} .ic.w{background:#fff;box-shadow:inset 0 0 0 1.5px var(--muted)}
.ic.sub{width:auto;height:auto;font-size:18px;line-height:1;color:var(--accent);font-weight:700}

/* Chronologie */
.log{margin-top:20px}
.loghead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.loghead h2{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700}
.ev{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.ev.edit{cursor:pointer}
.ev.ro{grid-template-columns:52px 1fr}
.ev .min{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.ev .what{display:flex;align-items:center;gap:8px;min-width:0}
.ev .txt{min-width:0}
.ev .txt b{font-weight:600}
.ev .txt div{color:var(--muted);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.del{color:var(--muted);font-size:20px;width:40px;height:40px;border-radius:10px}
.empty{color:var(--muted);padding:18px 4px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.period-mark{font-family:"Barlow Condensed",sans-serif;font-weight:600;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}

/* Compositions (vue publique) */
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.lineups h3{margin:0 0 4px;font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.lineups ol{list-style:none;margin:0;padding:0;font-size:14px}
.lineups li{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);min-width:0}
.lineups li span{min-width:0;overflow-wrap:anywhere}
.lineups li b{font-family:"Barlow Condensed",sans-serif;min-width:20px;text-align:right;flex:none}
.lineups ol.bench li{color:var(--muted)}
.lusub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:8px 0 2px}
.nolu{color:var(--muted);font-size:14px;margin:4px 0}
.loghead .link{padding:0}

.foot{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.fbtn{flex:1;padding:14px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);min-height:50px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.fbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fbtn.club{background:var(--club);color:#000;border-color:var(--club)}
.fbtn.danger{color:var(--red)}
.fbtn:disabled{opacity:.5;cursor:default}
.settings{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;color:var(--muted);font-size:14px}
.settings b{color:var(--ink)}

/* Formulaires */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h1{margin:0 0 4px;font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:800}
.card p.sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.field small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.field input,.field select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
.seg{display:flex;gap:6px}
.field.deleg{margin-top:14px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;min-height:46px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg{padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px;margin-bottom:12px}
.msg.err{border-color:var(--red);color:var(--red)}
.link{color:var(--muted);text-decoration:underline;font-size:14px;padding:8px 0}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.kpi b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.stats{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.stats th,table.stats td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.stats th{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;color:var(--muted)}
table.stats th button{font-weight:700;color:inherit;padding:2px 0}
table.stats th.on{color:var(--ink)}
table.stats td:first-child,table.stats th:first-child{text-align:left;padding-left:12px;white-space:normal;min-width:130px}
table.stats td:nth-child(2){font-weight:700;font-size:16px}
@media (max-width:420px){table.stats th,table.stats td{padding:9px 3px}table.stats td:first-child,table.stats th:first-child{padding-left:10px;min-width:118px}}
table.stats td.zero{color:var(--muted);opacity:.5}
table.stats tr:last-child td{border-bottom:0}
.note{color:var(--muted);font-size:13px;margin-top:8px}
.seasons{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px;font-size:14px}
.seasons select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

/* Admin */
.urow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.urow .who{flex:1;min-width:0}
.urow .who b{display:block;overflow-wrap:anywhere}
.urow .who small{color:var(--muted);overflow-wrap:anywhere}
.urow select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

/* Feuille (sheet) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;z-index:11;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;
  transform:translateY(105%);transition:transform .22s ease,visibility .22s;visibility:hidden}
.open .scrim{display:block}
.open .sheet{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet{max-height:92vh;overflow-y:auto}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:36vh;overflow-y:auto;margin-bottom:10px}
.chip{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:44px;text-align:left;font-size:14px;line-height:1.2}
.chip b{font-family:"Barlow Condensed",sans-serif;font-size:20px;min-width:24px;text-align:center}
.chip.bench{border-style:dashed}
.pname{text-align:center;color:var(--muted);font-weight:600;min-height:20px;margin-top:4px}
.pad .key{min-height:48px}
.lineup textarea{min-height:190px;font-size:14px}
.lineup .lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin:10px 0 4px}
.lineup .lhead label{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.photo{font-size:14px;font-weight:600;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.luteams button{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lubar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.lubar b{color:var(--ink)}
.lutools{display:flex;gap:6px}
.lurows{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}
.lrow{display:grid;grid-template-columns:54px minmax(0,1fr) auto 36px;gap:6px;align-items:center}
.lrow input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 8px;min-height:44px;width:100%;min-width:0}
.lrow .ln{text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px}
.lrow .ltog{padding:0 10px;min-height:44px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px}
.lrow.sub .ltog{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.lrow.sub .lname{color:var(--muted)}
.lrow .ldel{min-height:44px;color:var(--muted);font-size:22px}
.lrow.err input{border-color:var(--red)}
.lusug-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:14px 0 6px}
.lusug{display:flex;flex-wrap:wrap;gap:6px}
.lusug button{padding:7px 11px;border-radius:999px;border:1px dashed var(--line);background:var(--bg);font-size:14px}
.ocrstat{font-size:13px;color:var(--muted);min-height:18px;margin-top:4px}
.sheet h3{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700}
.sheet p{margin:2px 0 10px;color:var(--muted);font-size:14px}
.display{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:48px;text-align:center;
  border:2px solid var(--line);border-radius:14px;padding:4px;min-height:66px;font-variant-numeric:tabular-nums}
.display.empty-n{color:var(--muted);font-size:22px;font-weight:500;display:flex;align-items:center;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.key{background:var(--bg);border-radius:12px;min-height:56px;font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:600}
.key.ok{background:var(--club);color:#000;font-size:22px}
.minrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.minrow input{width:80px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.cancel{width:100%;margin-top:8px;padding:12px;color:var(--muted);font-weight:600}
textarea{width:100%;min-height:220px;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.loading{color:var(--muted);text-align:center;padding:40px 0}

/* ===== Design v2 ===== */
:root{padding-top:0}
.appbar{position:sticky;top:0;z-index:5;background:#000;border-bottom:3px solid var(--club);padding-top:env(safe-area-inset-top,0px)}
.appbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.appbar .brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:1;min-width:0;color:#fff}
.appbar .crest{width:42px;height:42px;flex:none}
.appbar b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;line-height:1;color:var(--club);letter-spacing:.5px}
.appbar small{display:block;color:rgba(255,255,255,.65);font-size:12px;margin-top:3px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12);flex:none;border:0}
.iconbtn svg{width:20px;height:20px}
.bell{filter:none;opacity:1}
.bell.on{background:var(--club);color:#000;border:0}
.acct{background:rgba(255,255,255,.12);color:#fff;border:0}
.acct.in{padding:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:none}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--club);color:#000;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:19px}
.wrap{padding-top:14px;padding-bottom:96px}
.day{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;margin:14px 2px 6px}
.day::first-letter{text-transform:uppercase}
.sec{margin-top:22px;margin-bottom:0}
.mcard{padding:10px 12px 12px;border-radius:16px}
.mcard.live{border-color:var(--live);box-shadow:inset 0 0 0 1px var(--live)}
.mtop{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.mcomp{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchip{flex:none;width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:14px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr);align-items:start;gap:6px}
.mside{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.mside.club{font-weight:800}
.mlg{width:42px;height:42px;object-fit:contain;border-radius:10px;background:#fff;padding:3px;display:block}
.mlg.ph{background:var(--line)}
.mmid{align-self:center;text-align:center;padding-bottom:18px}
.mtime{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.msc{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:32px;font-variant-numeric:tabular-nums;display:inline-flex;gap:6px}
.msc i{font-style:normal;opacity:.35}
.mdel{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);text-align:center}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--club);color:#000;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:18px;padding:14px 20px;border-radius:999px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.team .blg{width:58px;height:58px;padding:4px;border-radius:12px}
.mactions{display:flex;gap:8px;margin-top:12px}
.pill{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;min-height:44px;text-align:center}
.fbtn.big{width:100%;margin-top:10px}
.audit{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.ev{grid-template-columns:40px 32px minmax(0,1fr) auto;padding:10px 2px}
.ev.ro{grid-template-columns:40px 32px minmax(0,1fr)}
.ev .min{font-size:18px;color:var(--muted)}
.evi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:16px;line-height:1}
.ev.club .evi.goal{background:var(--club);border-color:var(--club)}
.evi .kc{width:11px;height:15px;border-radius:2px;display:block}
.kc.y{background:var(--yellow)} .kc.r{background:var(--red)} .kc.w{background:#fff;box-shadow:inset 0 0 0 1.5px var(--muted)}
.evi.sub{color:var(--accent);font-weight:800}
.evteam{color:var(--muted);font-weight:500;font-size:14px}
.evby{font-size:12px;color:var(--muted);margin-top:3px;font-style:italic}
.own{background:none!important;padding:0!important;border-radius:50%!important}
.clshead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 2px 8px}
.clshead h2{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:24px}
.clshead span{color:var(--muted);font-size:14px;text-align:right}
table.cls{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.cls th{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;color:var(--muted);padding:9px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.cls td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.cls tr:last-child td{border-bottom:0}
table.cls th:nth-child(2),table.cls td.tm{text-align:left}
table.cls td.rk{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;width:28px;color:var(--muted)}
table.cls td.tm .tmi{display:flex;align-items:center;gap:8px;min-width:0}
table.cls td.tm{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;line-height:1.1}
table.cls td.tm .tmi img{width:24px;height:24px;object-fit:contain;border-radius:5px;background:#fff;padding:1px;flex:none}
table.cls td.pts{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:17px}
table.cls tr.me td{background:color-mix(in srgb, var(--club) 22%, transparent)}
table.cls tr.me td.rk,table.cls tr.me td.tm{color:var(--ink);font-weight:800}
.note a{color:inherit}
.majbox{margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:12px;font-size:14px;color:var(--muted)}
.majbox b{color:var(--ink)}
.gerer{flex:none;background:var(--club);color:#000;font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
.urow{display:block}
.uline{display:flex;align-items:center;gap:10px}
.uteams{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.uteams button{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:17px}
.uteams button.on{background:var(--club);color:#000;border-color:var(--club)}
.uhint{font-size:12.5px;color:var(--muted)}
.fladmin{margin-top:8px;border-style:dashed}
.fladmin small{color:var(--muted);font-weight:500}
.ulab{font-size:13px;color:var(--muted);margin-right:2px}
.udel{flex:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.danger-link{color:var(--red)}
.acctop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.acctop h1{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:800}
.acctop .link{padding:0}
.acctabs{margin:10px 0 12px}
.nb{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;margin-left:4px}
.pendban{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:12px;border-radius:12px;background:color-mix(in srgb,var(--club) 25%,var(--surface));border:1px solid var(--club);font-weight:600;font-size:14px}
.tcard,.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.thead{display:flex;align-items:center;gap:12px}
.thead b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;line-height:1.1}
.thead small{display:block;color:var(--muted);font-size:13px}
.tbig{flex:none;width:42px;height:42px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:24px}
.tresp{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.rchip{display:inline-flex;align-items:center;gap:7px;padding:4px 4px 4px 4px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:14px}
.rchip button{width:26px;height:26px;border-radius:50%;color:var(--muted);font-size:18px;line-height:1}
.tnone{color:var(--muted);font-size:14px}
.tadd{width:100%;padding:10px;border-radius:10px;border:1px dashed var(--line);font-weight:600;font-size:14px;min-height:44px}
.pav{flex:none;width:36px;height:36px;border-radius:50%;background:var(--club);color:#000;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:18px}
.pav.sm{width:24px;height:24px;font-size:13px}
.phead{display:flex;align-items:center;gap:10px}
.phead .who{flex:1;min-width:0}
.phead .who b{display:block;overflow-wrap:anywhere}
.phead .who small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.rseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.rseg button{padding:6px 1px;border-radius:8px;font-weight:600;font-size:12px;line-height:1.15;min-height:40px;overflow-wrap:anywhere}
.rseg button.on{background:var(--ink);color:var(--bg)}
.rseg button:disabled{cursor:default;opacity:.55}
.rseg button.on:disabled{opacity:1}
.phint{margin:8px 0 0;color:var(--muted);font-size:13px}
.plist{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow-y:auto;margin-bottom:6px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;width:100%}
.pitem .who b{display:block}
.pitem .who small{color:var(--muted);font-size:13px}
.psearch{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.alist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.arow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .who{flex:1;min-width:0}
.arow .who b{display:block;overflow-wrap:anywhere}
.arow .who b small{color:var(--muted);font-weight:500}
.arow .who>small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.rbadge{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
.rbadge.r-admin{background:var(--ink);color:var(--bg)}
.rbadge.r-delegue{background:var(--club);color:#000}
.rbadge.r-dirigeant{background:color-mix(in srgb,var(--club) 22%,transparent);color:var(--ink)}
.rbadge.r-pending{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.amod{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;min-height:40px}
.secwarn{color:var(--red)}
.eqpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.eqpick button{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:56px}
.eqpick button b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;line-height:1}
.eqpick button small{font-size:10.5px;color:var(--muted);margin-top:2px}
.eqpick button.on{background:var(--club);border-color:var(--club);color:#000}
.eqpick button.on small{color:#000}
.onpill{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.onpill i{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
.onbig{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}
.onbig b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:44px;line-height:1}
.onbig span{color:var(--muted)}
.oncount{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.arow .pav{position:relative}
.arow.isOn .pav::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#3ddc84;border:2px solid var(--surface)}
.onstate{display:block;margin-top:3px;font-size:12px;font-weight:600;color:#2e9e5b}
.onstate:empty{display:none}
.accon{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:14px;font-weight:600}
.accon:empty{display:none}
.accon i{width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow2 .field{min-width:0}
.dpick{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font:inherit;text-align:left;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
.dpick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpick i{font-style:normal;opacity:.6}
.dpick:disabled{opacity:.6}
.dpq{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;margin:6px 0 10px}
.dplist{max-height:52vh;overflow-y:auto}
.dprow{width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.dprow.on{background:color-mix(in srgb,var(--club) 14%,transparent)}
.dpok{font-weight:800}
.visrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:-2px 0 10px}
.visrow small{color:var(--muted);font-size:12px;flex:1 1 180px}
.vistog{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;font:inherit;font-size:13px;font-weight:700;background:color-mix(in srgb,#3ddc84 18%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,#3ddc84 45%,transparent)}
.vistog i{width:30px;height:18px;border-radius:999px;background:#3ddc84;position:relative;flex:none}
.vistog i::after{content:"";position:absolute;top:2px;left:14px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.vistog.off{background:color-mix(in srgb,var(--red) 12%,transparent);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.vistog.off i{background:var(--muted)}
.vistog.off i::after{left:2px}
.vistog.static{cursor:default}
.compbar{margin:10px 0 4px}
table.stats tr.csc td{font-style:italic;color:var(--muted)}
table.stats tr.csc td small{font-size:11px}
table.stats tr.prow{cursor:pointer}
table.stats tr.prow:hover td,table.stats tr.prow:focus td{background:color-mix(in srgb,var(--club) 10%,transparent)}
table.stats tr.prow td:first-child{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.phero{display:flex;align-items:center;gap:12px;margin:2px 0 6px}
.phero h1{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:30px;line-height:1.05}
.phero .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.pav.big{width:52px;height:52px;font-size:24px;flex:none}
.kpi i.kc,.phmid i.kc{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:middle;margin:0 3px 3px 1px}
.kpi .kcartes{white-space:nowrap;font-size:20px;letter-spacing:-.3px}
.kpi .kcartes i.kc{width:8px;height:12px;margin:0 4px 2px 1px}
.pfacts{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:0 0 14px}
.pfacts:empty{display:none}
.pfacts div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.pfacts div:last-child{border-bottom:0}
.pfacts span{color:var(--muted)}
.pfacts b{text-align:right}
.phist{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.phtop{display:flex;align-items:center;gap:8px}
.phtop .mcomp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phmid{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:6px 0 2px;font-size:16px}
.pgoals{font-weight:700;font-size:14px}

.phsub{color:var(--muted);font-size:13px}
.statmode{margin:0 0 10px}
.sboard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.bhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bhead b{flex:1;font-family:"Barlow Condensed",sans-serif;font-size:20px}
.bhead span:last-child{color:var(--muted);font-size:13px}
.blist{list-style:none;margin:0;padding:0}
.blist li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.blist li:last-child{border-bottom:0}
.blist li:hover .bname,.blist li:focus .bname{text-decoration:underline}
.brk{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--line);font-weight:800;font-size:13px}
.brk.top1{background:#f5c518;color:#000}.brk.top2{background:#c0c6cc;color:#000}.brk.top3{background:#cd8a4b;color:#000}
.bname{flex:1;min-width:0;font-weight:600}
.bname small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.blist b{font-family:"Barlow Condensed",sans-serif;font-size:24px;min-width:28px;text-align:right}
.bcsc{margin:6px 2px 0;color:var(--muted);font-size:13px;font-style:italic}
.arow.gone{opacity:.85}
.arow.gone .pav{filter:grayscale(1)}
.acctotal{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:6px 0 4px}
.acctotal b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:38px;line-height:1}
.acctotal span{font-weight:700}
.acctotal small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.tfilter{margin:0 0 12px}
.tfilter .chipbar{margin-bottom:6px}
.tfilter .catbar button{font-weight:700}
.tfilter .teambar button{min-width:44px}
.segcat{margin-bottom:8px}
.segcat>small,.eqcat>small{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:0 0 4px}
.eqcat{margin-bottom:8px}
.fcat{grid-column:1/-1;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
.tchip{width:auto;min-width:22px;padding:0 5px}
.gonebtns{display:flex;gap:6px;flex:none}
.amod.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
/* Style dégradés (noir → or, jaune → ambre) */
:root{--gDark:linear-gradient(110deg,#000 0%,#1f1d12 45%,#6b5c00 100%);--gClub:linear-gradient(110deg,#F7E01A 0%,#F2B705 100%)}
/* bandeau du haut */
.top{background:var(--gDark);border-radius:16px;padding:10px 12px;margin-bottom:12px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.top b{color:#fff}.top small{color:rgba(255,255,255,.75)}
.top img{background:#fff;border-radius:50%;padding:2px}
.top .acct,.top .bell{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
/* titres de page = bandeau dégradé comme « NOUS CONTACTER » */
.card{border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.card>h1:first-child{margin:-16px -16px 14px;padding:16px 18px;background:var(--gDark);color:#fff;text-transform:uppercase;letter-spacing:.5px;font-size:24px}
.card>h1:first-child+p.sub{margin-top:-6px}
/* onglets et choix actifs */
.tabs{border:0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tabs a.on,.chipbar button.on,.seg button.on{background:var(--gDark);color:#fff;border-color:transparent}
/* boutons principaux */
.cbtn,.fab,.fbtn.club{background:var(--gClub);color:#000;border-color:transparent;box-shadow:0 4px 12px rgba(242,183,5,.35)}
/* tableau d'affichage */
.board{background:linear-gradient(135deg,#000 0%,#14130b 55%,#3d3500 100%);border-top:0;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.board::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--gClub)}
/* titres de section avec petite barre dégradée */
.sec{display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--gClub);flex:none}
/* cartes de match */
.mcard{border-radius:16px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.sboard{border-radius:16px;overflow:hidden}

.appbar{background:linear-gradient(110deg,#000 0%,#1f1d12 50%,#6b5c00 100%);border-bottom:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.appbar::after{content:'';display:block;height:3px;background:var(--gClub)}
.mcard{overflow:hidden;padding-top:0}
.mcard .mtop{display:flex;align-items:center;gap:8px;margin:0 -12px 10px;padding:7px 12px;background:var(--gDark);color:rgba(255,255,255,.85)}
.mcard .mtop .mcomp{color:#fff}
.mcard .mtop .tchip{background:var(--club);color:#000}
.mcard.live .mtop{background:linear-gradient(110deg,#7a0f12 0%,#D0262A 100%);color:#fff}
.mcard.live{box-shadow:0 4px 14px rgba(208,38,42,.25)}
.fbtn.primary{background:var(--gDark);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(0,0,0,.2);text-transform:uppercase;letter-spacing:.5px}
.day{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--gClub);color:#000;font-size:16px}
.themebtn{width:36px;height:36px}
.themebtn svg{width:18px;height:18px}
.appbar .brand>div{min-width:0;overflow:hidden}
@media (max-width:380px){.appbar-in{gap:6px;padding:10px 10px}.appbar .crest{width:34px;height:34px}.appbar b{font-size:18px}.appbar .iconbtn{width:34px;height:34px}.appbar .acct{padding:7px 10px;font-size:13px}}
/* Classements : résultats d'une équipe de la poule */
table.cls tr.tap{cursor:pointer}
table.cls tr.tap td.tm span::after{content:" ▾";color:var(--muted);font-size:11px}
table.cls tr.tap.open td.tm span::after{content:" ▴"}
table.cls tr.open td{border-bottom:0}
table.cls tr.clsdet td{padding:0 0 10px;text-align:left}
.hist{margin:0 4px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.hsum{display:flex;align-items:center;gap:5px;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--muted)}
.hsum>span{margin-right:2px}
.hsum small{margin-left:auto;font-size:12px}
.hist ul{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.hist li:first-child{border-top:0}
.hres{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:13px;color:#fff;background:var(--muted)}
.advcard h3,.hdm h3,.saison h3{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:800;margin:0 0 8px;text-transform:uppercase;letter-spacing:.3px}
.advcard,.hdm,.saison{margin:0 0 14px}
.formeb{display:flex;gap:4px}
.hdm .note{margin:0 0 10px}
.hdmlist{display:flex;flex-direction:column;gap:6px}
.hdmn{display:inline-block;min-width:22px;margin-right:6px;font-family:"Barlow Condensed",sans-serif;font-weight:800;color:var(--muted);text-align:right}
.hdmgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hdmgrid .hdmrow{min-height:42px;padding:0 10px;font-size:14px}.hdmgrid .hdmnom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdmmien{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--accent);border-radius:12px;background:var(--surface);font-size:15px}
.hdmadm{margin-top:10px;font-size:13px}.hdmadm summary{cursor:pointer;color:var(--muted);margin-bottom:6px}
.hdmrow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px;text-align:left;overflow:hidden;cursor:pointer}
.hdmrow:disabled{cursor:default;opacity:1}
.hdmrow.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hdmbar{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--club) 30%,transparent);transition:width .3s}
.hdmnom,.hdmrow b{position:relative}
.hdmwin{font-size:20px;font-weight:700;margin:0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hdmwin small{font-size:13px;font-weight:400;color:var(--muted)}
.hdmtop{list-style:none;margin:0;padding:4px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.hdmtop li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hdmtop li:last-child{border-bottom:0}
.convoc{display:block;margin:0 0 14px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--club) 22%,var(--surface));border:1px solid var(--club);color:var(--ink);text-decoration:none}
.convoc b{display:block;font-size:15px}.convoc span{font-size:13px;color:var(--muted)}
.courbewrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 6px;margin:0 0 10px}
.courbe{width:100%;height:auto;max-height:150px;overflow:visible;display:block}
.courbe .c1{stroke:var(--line);stroke-dasharray:3 4}
.courbe .cl{fill:none;stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke}
.courbe circle{fill:var(--accent)}
.courbe text{font-size:11px;fill:var(--ink);text-anchor:middle;font-weight:700}
.courbewrap small{display:block;font-size:12px;color:var(--muted);text-align:center}
.acompleter{margin:0 0 14px;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.acompleter summary{cursor:pointer;font-weight:600;font-size:14px}
.acompleter p{margin:10px 0 4px;font-size:13px}
.acompleter a{display:block;padding:6px 0;font-size:14px;color:var(--ink)}
.resumeimg{display:block;width:100%;max-width:360px;margin:0 auto;border-radius:10px;aspect-ratio:4/5}
.hres.V{background:var(--ok)}.hres.D{background:var(--red)}.hres.N{background:#8A8880}
.hdt{flex:none;width:52px;color:var(--muted);font-size:12.5px}
.hadv{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.hadv img{width:20px;height:20px;object-fit:contain;border-radius:4px;background:#fff;flex:none}
.hadv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsc{flex:none;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.hnone{margin:0;color:var(--muted);font-size:13px}
/* Carte d'un match dont on est le délégué (visible seulement par lui) */
.mcard.mine{border:2px solid #F2B705;box-shadow:0 6px 18px rgba(242,183,5,.35)}
.mdeleg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px -12px -12px;padding:10px 12px;background:var(--gClub);color:#000;cursor:pointer}
.mdeleg b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:17px;line-height:1.1;text-transform:uppercase;letter-spacing:.3px}
.mdeleg small{display:block;font-size:12.5px;opacity:.8}
.mdgo{flex:none;background:#000;color:#F7E01A;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:16px;padding:8px 14px;border-radius:999px}
/* Stats : recherche d'un joueur */
.statq{margin:2px 0 12px}
/* Choix du délégué : plein écran, liste visible au-dessus du clavier */
.tall .sheet{top:var(--vvt,0px);bottom:auto;height:var(--vvh,100dvh);max-height:none;border-radius:0;display:flex;flex-direction:column;overflow:hidden;
  padding-top:calc(12px + env(safe-area-inset-top,0px));transform:translateY(8%);opacity:0;transition:transform .18s ease,opacity .18s ease,visibility .18s}
.open.tall .sheet{transform:none;opacity:1}
.tall #shBody{display:flex;flex-direction:column;min-height:0;flex:1}
.tall .dplist{flex:1;max-height:none;min-height:0}
.dphead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dpclose{font-weight:700;color:var(--muted);padding:8px 4px;font-size:15px}
/* Matchs de coupe : niveau des équipes (une ligne) */
.rdv{margin:14px 0 4px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--yellow);font-size:15px}
.rdv b{font-size:17px}
.cobar{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--yellow) 18%,var(--surface));border:1px solid var(--yellow);font-size:14px}
.cobar small{display:block;color:var(--muted);margin-top:2px}
.note.provis{color:var(--ink);background:color-mix(in srgb,var(--yellow) 14%,transparent);border-radius:10px;padding:8px 10px}
.ev.moi{box-shadow:inset 4px 0 0 var(--club)}
.evmoi{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--club) 35%,transparent);border-radius:999px;padding:1px 8px}
li.moi > span:not(.lacts){font-weight:700} li.moi > span:not(.lacts)::after{content:" ⭐"}
tr.prow.moi td{background:color-mix(in srgb,var(--club) 22%,transparent);font-weight:700}
.monjoueur h2{margin:0 0 4px} .monjoueur .kpis{margin-top:10px}
.admtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px}.admtabs a{text-align:center;text-decoration:none;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600}.admtabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.schart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 6px;margin:0 0 14px}
.schart h3{font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:800;text-transform:uppercase;margin:0 0 6px}
.schart .leg{font-size:12px;color:var(--muted);margin:0 0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.schart .leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.barres{width:100%;height:auto;display:block;overflow:visible}.barres .ax{stroke:var(--line);stroke-width:2}
.barres .bl{font-size:19px;fill:var(--muted);text-anchor:middle}.barres .bv{font-size:17px;fill:var(--ink);text-anchor:middle;font-weight:700}
.bdet{margin:0 0 4px;font-size:14px;min-height:20px}.barres .bj{cursor:pointer}.barres .bj rect:not(.hit){transition:opacity .15s}.barres:has(.bj.sel) .bj:not(.sel) rect:not(.hit){opacity:.45}
.pvues{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}.pvues div{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:8px;font-size:13px}
.pvues i{height:10px;border-radius:5px;background:var(--club);min-width:2px}.pvues b{text-align:right}
.anotif{display:block;margin-top:3px;font-size:12px;color:var(--muted)}.anotif.on{color:var(--ok);font-weight:600}.anotif:empty{display:none}
.accnotif{margin:2px 0 0;font-size:13px;color:var(--muted)}.accnotif:empty{display:none}
.ajoueur{display:inline-block;margin-left:6px;font-size:12px;color:var(--muted)}
td.eqc{white-space:nowrap;text-align:center} td.eqc b{display:inline-block;min-width:18px} td.eqc small{color:var(--muted);margin-left:2px;font-size:11px}
.lineups li:has(.lacts){flex-wrap:wrap;row-gap:0}
.lacts{display:flex;flex-wrap:wrap;gap:0 8px;flex-basis:100%;padding-left:28px;margin-top:-1px;align-items:center}
.lacts .la{display:inline-flex;align-items:center;gap:1px;font-size:13px;white-space:nowrap}
.lacts .la small{font-size:10px;color:var(--muted)}
.lacts .la.in{color:var(--ok);font-weight:700} .lacts .la.out{color:var(--red);font-weight:700}
.lacts i.kc{display:inline-block;width:8px;height:11px;border-radius:2px}
.lineups:not(.remp) .la.in,.lineups:not(.remp) .la.out{display:none}
.rempbtn{display:block;margin:2px 0 8px;font-size:13px}
.histobox{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}
.histobox summary{cursor:pointer;padding:12px 0;font-weight:700}
.histo{list-style:none;margin:0 0 10px;padding:0;font-size:13px}
.histo li{display:grid;grid-template-columns:auto 1fr;gap:0 8px;padding:7px 0;border-top:1px solid var(--line)}
.histo .hat{color:var(--muted);font-variant-numeric:tabular-nums;grid-row:span 2}
.histo li span:last-child{overflow-wrap:anywhere}
.cgucase{display:flex;gap:10px;align-items:flex-start;margin:4px 0 10px;font-size:14px;line-height:1.35}
.cgucase input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--club)}
.cgucase .link{padding:0;font-size:inherit;text-decoration:underline}
.cgu h2{margin:0 0 4px} .cgu h3{margin:16px 0 4px;font-size:16px} .cgu p{margin:0 0 8px;font-size:14px;line-height:1.45}
.lieufoot .fbtn{flex:1;text-align:center;text-decoration:none}
.lieu{display:block;margin:8px auto 0;padding:4px 10px;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nivline{margin:8px 2px 0;font-size:13px;color:var(--muted);text-align:center}
.team .tniv{display:block;width:max-content;margin:5px auto 0;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.nivline .up{color:var(--red);font-weight:600}.nivline .down{color:var(--ok);font-weight:600}
/* Compo préparée sans numéros / fusion avec la photo */
.lrow.absent{box-shadow:inset 3px 0 0 var(--yellow);background:color-mix(in srgb,var(--yellow) 12%,transparent)}
.lrow .ln::placeholder{color:var(--muted);opacity:.7}
.chip.nonum b{color:var(--muted)}
/* Compo : nom proche d'un joueur déjà venu */
.lsosie{display:block;width:100%;margin:-2px 0 6px;padding:7px 10px;border-radius:10px;text-align:left;font-size:13px;background:color-mix(in srgb,var(--club) 22%,transparent);color:var(--ink);border:1px dashed color-mix(in srgb,var(--club) 70%,transparent)}
.lsosie b{font-weight:700}
/* Demandes « responsable score » */
.demcard{margin:10px 0;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.demcard small{color:var(--muted);font-size:13px}
.demcard .link{align-self:flex-start;padding:4px 0}
.demrow{display:flex;align-items:center;gap:6px;padding-top:6px;border-top:1px solid var(--line)}
.demrow span{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demrow .pill{flex:none;min-height:38px;padding:6px 12px}
.demrow .pill.ok{background:var(--gClub);color:#000;border-color:transparent}
.dembar{margin:0 0 12px;padding:10px 12px;border-radius:14px;background:var(--gClub);color:#000;box-shadow:0 4px 12px rgba(242,183,5,.3)}
.demtitle{font-weight:700;font-size:14px;margin-bottom:4px}
.demitem{display:flex;align-items:center;gap:8px;padding:7px 0 2px;border-top:1px solid rgba(0,0,0,.15);color:#000;text-decoration:none}
.demitem>span{flex:1;min-width:0;display:flex;flex-direction:column}
.demitem b{font-size:14px}.demitem small{font-size:12.5px;opacity:.8}
.demitem i{font-style:normal;font-weight:700;font-size:13px;flex:none}
.mdem{margin-top:8px;padding:7px 10px;border-radius:10px;background:var(--gClub);color:#000;font-size:13px;font-weight:600;text-align:center}
.amod.ok{background:var(--gClub);color:#000;border-color:transparent}
/* Coup d’envoi : 30 s pour annuler */
.undobar{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#111;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:14px}
.undobar span{flex:1}
.undobar b{color:#F7E01A}
.undobar button{flex:none;padding:9px 14px;border-radius:999px;background:var(--gClub);color:#000;font-weight:800}
/* Buteurs par équipe : 3 premiers + « Voir plus » */
.sboard:not(.open) .bmore{display:none}
.scherche .sboard .bmore:not([hidden]){display:flex}
.scherche .bvoir{display:none}
.sboard:not(.open) .blist li:nth-child(3){border-bottom:0}
.bvoir{display:block;width:100%;margin-top:6px;padding:8px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);background:var(--bg);border:1px dashed var(--line)}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in">
  <a class="brand" href="#/"><img class="crest" src="icons/notif-192.png" alt=""><div><b>AS MÉSANGER</b><small>Matchs en direct</small></div></a>
  <button class="onpill" id="online" hidden aria-label="Personnes en ligne" title="Personnes en ligne"><i></i><span>…</span></button>
  <button class="iconbtn themebtn" id="themeBtn" aria-label="Thème" title="Thème"></button>
  <button class="iconbtn bell" id="bell" aria-label="Notifications de buts" title="Notifications de buts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
  <a class="acct" id="acct" href="#/connexion">Connexion</a>
</div></header>
<div class="wrap">
  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#/" data-tab="matchs">Matchs</a>
    <a href="#/classements" data-tab="classements">Classements</a>
    <a href="#/stats" data-tab="stats">Stats</a>
  </nav>
  <main id="view"><div class="loading">Chargement…</div></main>
</div>

<div id="sheetRoot">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div id="shBody"></div>
  </div>
</div>
<a class="fab" id="fab" href="#/nouveau" hidden>+ Nouveau match</a>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="app.js"></script>
</body>
</html>
